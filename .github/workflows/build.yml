name: Build & Sign APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api: 37
        build-tools: 37.0.0

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.1'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.14.1

    - name: Grant execute permission
      run: chmod +x gradlew

    # ─── Signing Setup ───────────────────────────────────────────
    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        mkdir -p keystore
        echo "$KEYSTORE_BASE64" | base64 -d > keystore/allmight.jks
        echo "Keystore decoded successfully"

    - name: Create keystore.properties
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cat > keystore.properties << EOF
        storeFile=../keystore/allmight.jks
        storePassword=${STORE_PASSWORD}
        keyAlias=${KEY_ALIAS}
        keyPassword=${KEY_PASSWORD}
        EOF
        echo "keystore.properties created"

    # ─── Build ───────────────────────────────────────────────────
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # ─── Upload Artifacts ────────────────────────────────────────
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AllMightGameBooster-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Signed Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: AllMightGameBooster-signed-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    - name: Upload Unsigned Release APK
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: AllMightGameBooster-unsigned-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

    # ─── Cleanup ─────────────────────────────────────────────────
    - name: Cleanup Keystore
      if: always()
      run: rm -rf keystore keystore.properties
